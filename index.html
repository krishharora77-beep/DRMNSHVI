<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }


        /* =========================
           INTRO
        ========================= */

        #intro {
            position: fixed;
            inset: 0;

            background: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            z-index: 10;

            opacity: 1;

            transition: opacity 1s ease;
        }


        #introText {
            color: white;

            font-size: 24px;
            font-weight: 400;

            opacity: 0;

            transition: opacity 1s ease;

            padding: 20px;
        }


        /* =========================
           3D SCENE
        ========================= */

        #scene {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            opacity: 0;

            transition: opacity 2s ease;
        }


        canvas {
            display: block;
        }

    </style>
</head>


<body>


    <!-- =========================
         INTRO
    ========================= -->

    <div id="intro">

        <div id="introText"></div>

    </div>


    <!-- =========================
         THREE.JS SCENE
    ========================= -->

    <div id="scene"></div>


    <script type="module">

        import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


        // ==================================================
        // INTRO
        // ==================================================

        const intro =
            document.getElementById("intro");

        const introText =
            document.getElementById("introText");

        const sceneContainer =
            document.getElementById("scene");


        function showText(text, duration = 1800) {

            return new Promise(resolve => {

                introText.textContent = text;

                introText.style.opacity = "1";


                setTimeout(() => {

                    introText.style.opacity = "0";


                    setTimeout(() => {

                        resolve();

                    }, 1000);

                }, duration);

            });

        }


        async function startIntro() {

            await showText("Hey...");

            await showText(
                "I made something for you."
            );

            await showText(
                "Hope you like it."
            );


            // Fade out the black intro

            intro.style.opacity = "0";


            setTimeout(() => {

                intro.style.display = "none";

                sceneContainer.style.opacity = "1";

            }, 1000);

        }


        // ==================================================
        // THREE.JS SCENE
        // ==================================================

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(0x000000);


        // ==================================================
        // CAMERA
        // ==================================================

        const camera =
            new THREE.PerspectiveCamera(
                45,
                window.innerWidth /
                window.innerHeight,
                0.1,
                100
            );


        camera.position.set(
            0,
            2.4,
            6
        );


        camera.lookAt(
            0,
            0.4,
            0
        );


        // ==================================================
        // RENDERER
        // ==================================================

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                powerPreference:
                    "high-performance"

            });


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        sceneContainer.appendChild(
            renderer.domElement
        );


        // ==================================================
        // LIGHTING
        // ==================================================

        const ambientLight =
            new THREE.AmbientLight(
                0xffffff,
                1.8
            );


        scene.add(
            ambientLight
        );


        const keyLight =
            new THREE.DirectionalLight(
                0xffffff,
                2.5
            );


        keyLight.position.set(
            3,
            5,
            4
        );


        scene.add(
            keyLight
        );


        // ==================================================
        // CAKE GROUP
        // ==================================================

        const cake =
            new THREE.Group();


        scene.add(
            cake
        );


        // ==================================================
        // BOTTOM CAKE
        // ==================================================

        const baseGeometry =
            new THREE.CylinderGeometry(
                1.5,
                1.5,
                1.0,
                32
            );


        const baseMaterial =
            new THREE.MeshStandardMaterial({

                color: 0xf2e3d5,

                roughness: 0.7,

                metalness: 0

            });


        const base =
            new THREE.Mesh(
                baseGeometry,
                baseMaterial
            );


        cake.add(
            base
        );


        // ==================================================
        // TOP CAKE LAYER
        // ==================================================

        const topGeometry =
            new THREE.CylinderGeometry(
                1.2,
                1.2,
                0.35,
                32
            );


        const topMaterial =
            new THREE.MeshStandardMaterial({

                color: 0xffffff,

                roughness: 0.7,

                metalness: 0

            });


        const top =
            new THREE.Mesh(
                topGeometry,
                topMaterial
            );


        top.position.y =
            0.67;


        cake.add(
            top
        );


        // ==================================================
        // CANDLE
        // ==================================================

        const candleGeometry =
            new THREE.CylinderGeometry(
                0.12,
                0.12,
                0.8,
                16
            );


        const candleMaterial =
            new THREE.MeshStandardMaterial({

                color: 0xd4a017,

                roughness: 0.6

            });


        const candle =
            new THREE.Mesh(
                candleGeometry,
                candleMaterial
            );


        candle.position.y =
            1.25;


        cake.add(
            candle
        );


        // ==================================================
        // FLAME
        // ==================================================

        const flameGeometry =
            new THREE.SphereGeometry(
                0.16,
                12,
                12
            );


        const flameMaterial =
            new THREE.MeshStandardMaterial({

                color: 0xffaa00,

                emissive: 0xff6600,

                emissiveIntensity: 0.8

            });


        const flame =
            new THREE.Mesh(
                flameGeometry,
                flameMaterial
            );


        flame.scale.y =
            1.5;


        flame.position.y =
            1.75;


        cake.add(
            flame
        );


        // ==================================================
        // FLOOR
        // ==================================================

        const floorGeometry =
            new THREE.CircleGeometry(
                5,
                48
            );


        const floorMaterial =
            new THREE.MeshStandardMaterial({

                color: 0x080808,

                roughness: 0.9

            });


        const floor =
            new THREE.Mesh(
                floorGeometry,
                floorMaterial
            );


        floor.rotation.x =
            -Math.PI / 2;


        floor.position.y =
            -0.55;


        scene.add(
            floor
        );


        // ==================================================
        // ANIMATION
        // ==================================================

        function animate() {

            requestAnimationFrame(
                animate
            );


            // Temporary test rotation.
            // This will NOT be in the final cake.

            cake.rotation.y +=
                0.01;


            renderer.render(
                scene,
                camera
            );

        }


        animate();


        // ==================================================
        // RESPONSIVE
        // ==================================================

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        // ==================================================
        // START
        // ==================================================

        startIntro();

    </script>

</body>
</html>
