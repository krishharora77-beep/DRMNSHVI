<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Birthday</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:Arial, sans-serif; touch-action:none; }

  /* ========================= INTRO ========================= */
  #intro {
    position:fixed; inset:0; background:#000;
    display:flex; align-items:center; justify-content:center;
    text-align:center; z-index:30; opacity:1; transition:opacity 1s ease;
  }
  #introText { color:white; font-size:24px; font-weight:400; opacity:0; transition:opacity 1s ease; padding:20px; }

  /* ========================= 3D SCENE ========================= */
  #scene { position:fixed; inset:0; width:100vw; height:100vh; opacity:0; transition:opacity 2s ease; }
  canvas { display:block; }

  /* ========================= TRANSITION OVERLAY ========================= */
  #fadeOverlay {
    position:fixed; inset:0; background:#000; opacity:0;
    transition:opacity 0.9s ease; pointer-events:none; z-index:20;
  }

  /* ========================= TAP HINT ========================= */
  #tapHint {
    position:fixed; left:50%; bottom:8%; transform:translateX(-50%);
    color:rgba(255,255,255,0.55); letter-spacing:0.14em; font-size:12px;
    text-transform:uppercase; opacity:0; transition:opacity 1s ease;
    pointer-events:none; z-index:5;
  }
  #tapHint.show { opacity:1; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4;} 50%{opacity:0.9;} }

  #proceedBtn {
    position:fixed; left:50%; bottom:8%; transform:translateX(-50%);
    z-index:25; display:none; opacity:0;
    padding:13px 30px; border:1px solid rgba(255,255,255,0.55);
    border-radius:999px; background:rgba(255,255,255,0.10);
    color:#fff; font-size:13px; letter-spacing:0.18em;
    text-transform:uppercase; backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); cursor:pointer;
    transition:opacity .6s ease, transform .2s ease, background .2s ease;
  }
  #proceedBtn.show { display:block; opacity:1; }
  #proceedBtn:active { transform:translateX(-50%) scale(.96); background:rgba(255,255,255,0.18); }
  #birthdayMessage {
    position:fixed; inset:0; z-index:30; display:flex; align-items:flex-end; justify-content:center;
    padding:0 20px 12vh; pointer-events:none; opacity:0; transition:opacity 1.2s ease;
  }
  #birthdayMessage.show { opacity:1; }
  .birthdayTitle {
    color:#fff; font-size:clamp(2rem,7vw,4.8rem); font-weight:700; letter-spacing:.04em;
    text-align:center; text-shadow:0 0 18px rgba(255,255,255,.35), 0 0 40px rgba(255,180,220,.22);
  }

  #celebration {
    position:fixed; inset:0; pointer-events:none; z-index:18; overflow:hidden;
  }
  .confetti {
    position:absolute; top:-12px; width:7px; height:12px;
    border-radius:2px; opacity:0;
    animation:confettiFall 2.6s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes confettiFall {
    0% { transform:translate3d(0,0,0) rotate(0deg); opacity:1; }
    100% { transform:translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); opacity:0; }
  }
  .celebrateRing {
    position:absolute; left:50%; top:45%; width:20px; height:20px;
    border:2px solid rgba(255,255,255,.8); border-radius:50%;
    transform:translate(-50%,-50%) scale(.2); opacity:0;
    animation:ringPop 1s ease-out forwards;
  }
  @keyframes ringPop {
    0% { transform:translate(-50%,-50%) scale(.2); opacity:.9; }
    100% { transform:translate(-50%,-50%) scale(9); opacity:0; }
  }
</style>
</head>

<script type="module">
import * as THREE from "three";

/* ==================================================================
   BIRTHDAY WEBSITE — MERGED BUILD
   Flow: intro -> cake (interactive) -> blowout -> transition -> reveal
   Cake design: 2-tier white pearlescent cake, shell borders, beaded
   swag garland at the tier seam, two stargazer-lily blooms.

// ==================================================
// STATE
// ==================================================
const PHASE = { INTRO:'intro', CAKE:'cake', BLOWOUT:'blowout', TRANSITION:'transition', REVEAL:'reveal' };
const BIRTHDAY_NAME = "________";
let phase = PHASE.INTRO;

// ==================================================
// TINY TWEEN UTILITY (no external library)
// ==================================================
const animators = [];
function easeInOutQuad(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }
function animateValue({ from, to, duration, ease=t=>t, onUpdate, onComplete }) {
  const start = performance.now();
  animators.push(function (now) {
    let p = (now - start) / duration;
    if (p > 1) p = 1;
    onUpdate(from + (to - from) * ease(p));
    if (p >= 1) { if (onComplete) onComplete(); return true; }
    return false;
  });
}

// ==================================================
// TINY SYNTH AUDIO (no external files needed)
// ==================================================
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playPoof() {
  ensureAudio();
  const t0 = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * 0.3;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 900;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
  noise.connect(filter).connect(gain).connect(audioCtx.destination);
  noise.start(); noise.stop(t0 + 0.3);
}
function playWhoosh() {
  ensureAudio();
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(55, t0);
  osc.frequency.exponentialRampToValueAtTime(28, t0 + 2.2);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.6);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + 2.3);

  const osc2 = audioCtx.createOscillator(); osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(600, t0);
  osc2.frequency.exponentialRampToValueAtTime(1500, t0 + 1.0);
  const gain2 = audioCtx.createGain();
  gain2.gain.setValueAtTime(0.0001, t0);
  gain2.gain.exponentialRampToValueAtTime(0.06, t0 + 0.5);
  gain2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
  osc2.connect(gain2).connect(audioCtx.destination);
  osc2.start(t0); osc2.stop(t0 + 1.7);
}

      setTimeout(resolve, 1000);

}

async function startIntro() {
  await showText("Hey...");
  await showText("I made something for you.");
  await showText("Hope you like it.");
  intro.style.opacity = "0";
  setTimeout(() => {

bottomTier.position.y = BOTTOM_H / 2;
bottomTier.castShadow = true; bottomTier.receiveShadow = true;

const topTier = new THREE.Mesh(new THREE.CylinderGeometry(TOP_R, TOP_R * 1.01, TOP_H, 64), icingMat());
topTier.position.y = BOTTOM_H + TOP_H / 2;

// ---- piped shell borders (base of cake + tier seam collar) ----
function buildShellRing(radius, y, count, scale, color) {
  const geo = new THREE.SphereGeometry(0.13, 10, 8);
  const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.45, clearcoat: 0.3, iridescence: 0.1 });
  const mesh = new THREE.InstancedMesh(geo, mat, count);
  mesh.castShadow = true;
  const dummy = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    dummy.position.set(Math.cos(a) * radius, y, Math.sin(a) * radius);
    dummy.rotation.set(0, -a, 0);
    dummy.scale.set(scale, scale * 0.7, scale * 1.55);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  return mesh;
}
cakeGroup.add(buildShellRing(BOTTOM_R * 1.02, 0.08, 54, 1.1, 0xfaf7f2));            // base of cake
cakeGroup.add(buildShellRing(TOP_R * 1.06, BOTTOM_H + 0.08, 40, 0.95, 0xfaf7f2));   // collar at tier seam

// ---- beaded swag garland (draped pearl chain around the seam) ----
function buildGarland(radius, baseY, dip, swagCount, perSwag, color) {
  const total = swagCount * perSwag;
  const geo = new THREE.SphereGeometry(0.035, 8, 8);
  const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.25, clearcoat: 0.6, iridescence: 0.2 });
  const mesh = new THREE.InstancedMesh(geo, mat, total);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < total; i++) {
    const theta = (i / total) * Math.PI * 2;
    const y = baseY - dip * (0.5 - 0.5 * Math.cos(swagCount * theta));
    dummy.position.set(Math.cos(theta) * radius, y, Math.sin(theta) * radius);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  return mesh;
}
function buildGarlandDrops(radius, baseY, dip, swagCount, color) {
  const geo = new THREE.SphereGeometry(0.06, 10, 10);
  const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.25, clearcoat: 0.6, iridescence: 0.2 });
  const mesh = new THREE.InstancedMesh(geo, mat, swagCount);
  const dummy = new THREE.Object3D();
  for (let k = 0; k < swagCount; k++) {
    const theta = (Math.PI + k * 2 * Math.PI) / swagCount;
    dummy.position.set(Math.cos(theta) * radius, baseY - dip - 0.03, Math.sin(theta) * radius);
    dummy.updateMatrix();
    mesh.setMatrixAt(k, dummy.matrix);
  }
  return mesh;
}
const GARLAND_R = BOTTOM_R * 1.01 + 0.02, GARLAND_Y = BOTTOM_H - 0.15, GARLAND_DIP = 0.18, GARLAND_SWAGS = 10;
cakeGroup.add(buildGarland(GARLAND_R, GARLAND_Y, GARLAND_DIP, GARLAND_SWAGS, 9, 0xfdf9f2));
cakeGroup.add(buildGarlandDrops(GARLAND_R, GARLAND_Y, GARLAND_DIP, GARLAND_SWAGS, 0xfdf9f2));

// ---- stargazer lily blooms ----
function petalShape(length, width) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(width, length * 0.4, 0, length);
  s.quadraticCurveTo(-width, length * 0.4, 0, 0);
  return s;
}
function makePetal(length, width, color) {
  const geo = new THREE.ExtrudeGeometry(petalShape(length, width), { depth: 0.025, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 2 });
  geo.translate(0, 0, -0.0125);
  const mat = new THREE.MeshPhysicalMaterial({ color, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.3, iridescence: 0.25, iridescenceIOR: 1.3, side: THREE.DoubleSide });
  return new THREE.Mesh(geo, mat);
}
function makeLily(lenOuter, lenInner, outerColor, innerColor, filamentColor, antherColor) {
  const group = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const p = makePetal(lenOuter, lenOuter * 0.35, outerColor);
    p.rotation.x = -Math.PI / 2 + 0.5; p.rotation.z = (i / 3) * Math.PI * 2; p.castShadow = true;
    group.add(p);
  }
  for (let i = 0; i < 3; i++) {
    const p = makePetal(lenInner, lenInner * 0.32, innerColor);
    p.rotation.x = -Math.PI / 2 + 0.8; p.rotation.z = (i / 3) * Math.PI * 2 + Math.PI / 3; p.castShadow = true;
    group.add(p);
  }
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const filament = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.014, lenOuter * 0.65, 6), new THREE.MeshStandardMaterial({ color: filamentColor, roughness: 0.6 }));
    filament.position.set(Math.cos(a) * 0.05, lenOuter * 0.3, Math.sin(a) * 0.05);
    filament.rotation.z = Math.cos(a) * 0.5; filament.rotation.x = Math.sin(a) * 0.5;
    const anther = new THREE.Mesh(new THREE.SphereGeometry(0.032, 8, 8), new THREE.MeshStandardMaterial({ color: antherColor, roughness: 0.5 }));
    anther.position.y = lenOuter * 0.33;
    filament.add(anther);
    group.add(filament);
  }
  return group;
}

const candle = new THREE.Group();

wick.position.y = 0.72;

flame.position.y = 0.82;
candle.add(flame);

function makeSoftGlowTexture(colorInner) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const rg = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, colorInner); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
}
const glowTex = makeSoftGlowTexture('rgba(255,190,110,0.9)');
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
glow.scale.set(0.5, 0.5, 1); glow.position.y = 0.8;
candle.add(glow);

const flameLight = new THREE.PointLight(0xffb066, 1.1, 2.2);
flameLight.position.y = 0.82;
candle.add(flameLight);

candle.position.set(0.55, TOTAL_H + 0.02, -0.35);
cakeGroup.add(candle);

// ==================================================
// SMOKE / ATMOSPHERE HELPER (used at blowout + reveal)
// ==================================================
const smokeTex = makeSoftGlowTexture('rgba(210,210,215,0.55)');
function spawnSmoke(origin) {
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0.5 }));
  spr.position.copy(origin);
  spr.scale.set(0.4, 0.4, 1);
  scene.add(spr);
  const driftX = (Math.random() - 0.5) * 0.4;
  animateValue({
    from: 0, to: 1, duration: 1800 + Math.random() * 600,
    onUpdate: (p) => {
      spr.position.y = origin.y + p * 1.4;
      spr.position.x = origin.x + driftX * p;
      spr.material.opacity = 0.5 * (1 - p);
      const s = 0.4 + p * 0.8;
      spr.scale.set(s, s, 1);
    },
    onComplete: () => scene.remove(spr)
  });
}

// ==================================================

// ==================================================
const heroCar = new THREE.Group();
const carMat = new THREE.MeshPhysicalMaterial({ color: 0x171a1f, metalness: 0.6, roughness: 0.35, clearcoat: 0.5, clearcoatRoughness: 0.25 });

const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 4.2), carMat);

heroCar.add(hood);

const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 20);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0c0c0c, roughness: 0.6 });
[[-1.0, 0.42, 1.35], [1.0, 0.42, 1.35], [-1.0, 0.42, -1.35], [1.0, 0.42, -1.35]].forEach(p => {
  const w = new THREE.Mesh(wheelGeo, wheelMat);

  w.position.set(p[0], p[1], p[2]);

const drlGeo = new THREE.BoxGeometry(0.55, 0.06, 0.05);
const drlL = new THREE.Mesh(drlGeo, new THREE.MeshStandardMaterial({ color: 0xbfe8ff, emissive: 0x66d9ff, emissiveIntensity: 0 }));
drlL.position.set(-0.65, 0.55, 2.09);
const drlR = new THREE.Mesh(drlGeo, new THREE.MeshStandardMaterial({ color: 0xbfe8ff, emissive: 0x66d9ff, emissiveIntensity: 0 }));
drlR.position.set(0.65, 0.55, 2.09);
heroCar.add(drlL, drlR);

const grille = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.3), new THREE.MeshStandardMaterial({ color: 0x090909 }));
grille.position.set(0, 0.42, 2.1);
heroCar.add(grille);

heroCar.visible = false;
scene.add(heroCar);

// ---- swap-in point for the real model (fill this in later) ----
const REAL_CAR_URL = null; // e.g. "./models/m5cs.glb"
function loadRealCar(url) {
  new GLTFLoader().load(url, (gltf) => {
    scene.remove(heroCar);
    const realCar = gltf.scene;
    realCar.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    realCar.visible = heroCar.visible;
    scene.add(realCar); // NOTE: scale/position will need tuning per-model
  }, undefined, (err) => console.error('Failed to load car model:', err));
}
if (REAL_CAR_URL) loadRealCar(REAL_CAR_URL);

// ==================================================
// CAMERA CONTROLS (cake-viewing only; off during reveal)
// ==================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, TOTAL_H * 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 3.8;
controls.maxDistance = 8.5;
controls.minPolarAngle = Math.PI * 0.25;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.6;
controls.enabled = false;

// ==================================================
// INTERACTION — Day 4: tap the cake/candle to blow it out
// ==================================================
const proceedBtn = document.getElementById("proceedBtn");
const celebration = document.getElementById("celebration");
const birthdayMessage = document.getElementById("birthdayMessage");
document.getElementById("birthdayName").textContent = BIRTHDAY_NAME;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (phase !== PHASE.CAKE) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(cakeGroup.children, true);
  if (hits.length > 0) blowOutCandle();
});

function enterCakeScene() {
  phase = PHASE.CAKE;
  controls.enabled = true;
  controls.autoRotate = true;
  document.getElementById('tapHint').classList.add('show');
}

function triggerCelebration() {
  celebration.innerHTML = '';
  const pieces = 48;
  for (let i = 0; i < pieces; i++) {
    const c = document.createElement('span');
    c.className = 'confetti';
    c.style.left = (35 + Math.random() * 30) + 'vw';
    c.style.setProperty('--dx', ((Math.random() - 0.5) * 90) + 'vw');
    c.style.setProperty('--rot', ((Math.random() - 0.5) * 1400) + 'deg');
    c.style.animationDelay = (Math.random() * 0.45) + 's';
    c.style.background = ['#ffffff','#f7d37b','#e9a8c4','#b8d8ff','#d9c2ff'][i % 5];
    c.style.width = (5 + Math.random() * 5) + 'px';
    c.style.height = (8 + Math.random() * 8) + 'px';
    celebration.appendChild(c);
  }

  for (let i = 0; i < 2; i++) {
    const ring = document.createElement('span');
    ring.className = 'celebrateRing';
    ring.style.animationDelay = (i * 120) + 'ms';
    celebration.appendChild(ring);
  }

  setTimeout(() => { celebration.innerHTML = ''; }, 3400);
}

function blowOutCandle() {
  if (phase !== PHASE.CAKE) return;
  phase = PHASE.BLOWOUT;
  document.getElementById('tapHint').classList.remove('show');
  controls.autoRotate = false;
  controls.enabled = true;
  ensureAudio(); playPoof();
  triggerCelebration();

  const worldPos = new THREE.Vector3();
  flame.getWorldPosition(worldPos);
  spawnSmoke(worldPos);
  setTimeout(() => spawnSmoke(worldPos.clone().add(new THREE.Vector3(0.05, 0.05, 0))), 200);

  animateValue({ from: 1, to: 0.001, duration: 400, onUpdate: v => flame.scale.set(v, v, v) });
  animateValue({ from: flameLight.intensity, to: 0, duration: 400, onUpdate: v => flameLight.intensity = v });
  animateValue({ from: 0.75, to: 0, duration: 400, onUpdate: v => glow.material.opacity = v });

  // The cake stays exactly where it is. No automatic transition.
  setTimeout(() => {
    proceedBtn.classList.add('show');
  }, 900);
}

proceedBtn.addEventListener('click', () => {
  if (phase !== PHASE.BLOWOUT) return;
  proceedBtn.classList.remove('show');
  startTransition();
});

// ==================================================
// TRANSITION SYSTEM — Day 5
// ==================================================
function startTransition() {
  phase = PHASE.TRANSITION;
  controls.enabled = false;
  const overlay = document.getElementById('fadeOverlay');
  overlay.style.opacity = '1';
  setTimeout(() => {
    cakeGroup.visible = false;
    camera.position.set(0, 1.1, 5.5);
    camera.lookAt(0, 0.6, 0);
    startReveal();
  }, 900);
}

// ==================================================
// REVEAL SEQUENCE — Days 6-9
// ==================================================
function startReveal() {
  phase = PHASE.REVEAL;
  heroCar.visible = true;
  hemi.intensity = 0.05;
  key.intensity = 0.1;

  const overlay = document.getElementById('fadeOverlay');
  setTimeout(() => { overlay.style.opacity = '0'; }, 100);

  // Final birthday message — edit BIRTHDAY_NAME at the top of the script.
  setTimeout(() => { birthdayMessage.classList.add('show'); }, 5200);

  // lighting reveal
  animateValue({ from: 0, to: 2.2, duration: 1600, ease: easeInOutQuad, onUpdate: v => revealSpot.intensity = v });
  animateValue({ from: 0, to: 0.5, duration: 1600, ease: easeInOutQuad, onUpdate: v => carRim.intensity = v });
  playWhoosh();

  // DRL moment
  setTimeout(() => {
    animateValue({ from: 0, to: 3, duration: 900, onUpdate: v => { drlL.material.emissiveIntensity = v; drlR.material.emissiveIntensity = v; } });
  }, 1500);

  // camera push-in to hero framing
  setTimeout(() => {
    const startPos = new THREE.Vector3(0, 1.1, 5.5);
    const endPos = new THREE.Vector3(1.6, 0.75, 3.4);
    animateValue({
      from: 0, to: 1, duration: 3200, ease: easeInOutQuad,
      onUpdate: (p) => {
        camera.position.lerpVectors(startPos, endPos, p);
        camera.lookAt(0, 0.55, 0.3);
      },
      onComplete: spawnAtmosphere
    });
  }, 1800);
}

function spawnAtmosphere() {
  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      const x = (Math.random() - 0.5) * 2.2;
      spawnSmoke(new THREE.Vector3(x, 0.05, 1.8 + Math.random() * 0.6));
    }, i * 350);
  }
}

// ==================================================
// ANIMATION LOOP
// ==================================================
function animate(now) {
  requestAnimationFrame(animate);

  const t = now * 0.001;
  if (flame.scale.y > 0.01) {
    flame.scale.y = 1 + Math.sin(t * 14) * 0.08 + Math.sin(t * 3.3) * 0.04;
    flameLight.intensity = 1.0 + Math.sin(t * 16) * 0.15 + Math.sin(t * 5) * 0.1;
  }

  for (let i = animators.length - 1; i >= 0; i--) {
    if (animators[i](now)) animators.splice(i, 1);
  }

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// ==================================================
// RESPONSIVE
// ==================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ==================================================
// START
// ==================================================
startIntro();
</script>
</body>
</html>
